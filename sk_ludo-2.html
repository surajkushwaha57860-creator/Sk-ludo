<!doctype html><html lang='hi'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>SK LUDO</title><style>body{font-family:Arial;text-align:center;background:#f2f2f2;padding:15px}.board{max-width:360px;margin:20px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.c{height:100px;border:2px solid #222;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:34px;background:#fff}.r{background:#ff7777}.g{background:#75df91}.y{background:#ffe477}.b{background:#77a8ff}button{padding:12px 18px;font-size:18px;border:0;border-radius:9px;background:#222;color:#fff;margin:5px}#msg{font-size:18px}</style><h1>🎮 SK LUDO</h1><p>4 खिलाड़ी • पासा गेम</p><div class='board'><div class='c r'>🔴</div><div class='c'>⬜</div><div class='c g'>🟢</div><div class='c'>⬜</div><div class='c y' id='die'>🎲</div><div class='c'>⬜</div><div class='c b'>🔵</div><div class='c'>⬜</div><div class='c'>🏆</div></div><div id='msg'>लाल खिलाड़ी की बारी</div><button onclick='roll()'>पासा फेंको 🎲</button><button onclick='resetGame()'>रीसेट</button><script>let i=0,names=['लाल','हरा','पीला','नीला'],faces=['⚀','⚁','⚂','⚃','⚄','⚅'];function roll(){let n=Math.floor(Math.random()*6);document.getElementById('die').textContent=faces[n];i=(i+1)%4;document.getElementById('msg').textContent='पासा: '+(n+1)+' | '+names[i]+' खिलाड़ी की बारी'}function resetGame(){i=0;document.getElementById('die').textContent='🎲';document.getElementById('msg').textContent='लाल खिलाड़ी की बारी'}</script></html>
